<!DOCTYPE html>

<html class="light" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Danh Sách Đơn Hàng</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#36e27b",
            "background-light": "#f6f8f7",
            "background-dark": "#112117",
          },
          fontFamily: {
            "display": ["Inter", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="relative flex h-auto min-h-screen w-full flex-col group/design-root overflow-x-hidden">
<!-- Top App Bar -->
<header class="sticky top-0 z-10 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-sm">
<div class="flex items-center p-4 pb-2 justify-between">
<div class="flex size-12 shrink-0 items-center justify-start">
<!-- Placeholder for potential back button or menu -->
</div>
<h1 class="text-[#111714] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center">Danh Sách Đơn Hàng</h1>
<div class="flex w-12 items-center justify-end">
<button class="flex max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-full h-10 w-10 text-[#111714] dark:text-white">
<span class="material-symbols-outlined text-2xl">search</span>
</button>
</div>
</div>
</header>
<!-- Chips Filter -->
<div class="sticky top-[60px] z-10 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-sm">
<div class="flex gap-2 p-4 pt-2 overflow-x-auto whitespace-nowrap">
<button class="flex h-10 shrink-0 items-center justify-center gap-x-2 rounded-full bg-primary/20 dark:bg-primary/30 px-5">
<p class="text-primary dark:text-primary text-sm font-bold leading-normal">Tất cả</p>
</button>
<button class="flex h-10 shrink-0 items-center justify-center gap-x-2 rounded-full bg-[#f0f4f2] dark:bg-white/10 px-5">
<p class="text-[#111714] dark:text-white/80 text-sm font-medium leading-normal">Chờ thanh toán</p>
</button>
<button class="flex h-10 shrink-0 items-center justify-center gap-x-2 rounded-full bg-[#f0f4f2] dark:bg-white/10 px-5">
<p class="text-[#111714] dark:text-white/80 text-sm font-medium leading-normal">Đã thanh toán</p>
</button>
<button class="flex h-10 shrink-0 items-center justify-center gap-x-2 rounded-full bg-[#f0f4f2] dark:bg-white/10 px-5">
<p class="text-[#111714] dark:text-white/80 text-sm font-medium leading-normal">Đã hủy</p>
</button>
</div>
</div>
<!-- Order List -->
<main class="flex-grow px-4 pb-24 space-y-3">
<!-- List Item 1 -->
<div class="flex items-center gap-4 bg-white dark:bg-white/5 p-4 rounded-xl shadow-sm cursor-pointer">
<div class="flex items-center justify-center rounded-full bg-primary/20 shrink-0 size-12">
<span class="material-symbols-outlined text-primary text-3xl">check_circle</span>
</div>
<div class="flex-grow">
<p class="text-[#111714] dark:text-white text-base font-bold leading-normal line-clamp-1">#1254 - 10:35 AM</p>
<p class="text-[#648772] dark:text-white/60 text-sm font-normal leading-normal line-clamp-2">3 sản phẩm</p>
</div>
<div class="text-right shrink-0 flex items-center gap-2">
<p class="text-[#111714] dark:text-white text-base font-bold leading-normal">155.000đ</p>
<span class="material-symbols-outlined text-gray-400 dark:text-white/40">chevron_right</span>
</div>
</div>
<!-- List Item 2 -->
<div class="flex items-center gap-4 bg-white dark:bg-white/5 p-4 rounded-xl shadow-sm cursor-pointer">
<div class="flex items-center justify-center rounded-full bg-orange-400/20 shrink-0 size-12">
<span class="material-symbols-outlined text-orange-400 text-3xl">hourglass_top</span>
</div>
<div class="flex-grow">
<p class="text-[#111714] dark:text-white text-base font-bold leading-normal line-clamp-1">#1253 - 10:32 AM</p>
<p class="text-[#648772] dark:text-white/60 text-sm font-normal leading-normal line-clamp-2">2 sản phẩm</p>
</div>
<div class="text-right shrink-0 flex items-center gap-2">
<p class="text-[#111714] dark:text-white text-base font-bold leading-normal">85.000đ</p>
<span class="material-symbols-outlined text-gray-400 dark:text-white/40">chevron_right</span>
</div>
</div>
<!-- List Item 3 -->
<div class="flex items-center gap-4 bg-white dark:bg-white/5 p-4 rounded-xl shadow-sm cursor-pointer">
<div class="flex items-center justify-center rounded-full bg-red-500/20 shrink-0 size-12">
<span class="material-symbols-outlined text-red-500 text-3xl">cancel</span>
</div>
<div class="flex-grow">
<p class="text-[#111714] dark:text-white text-base font-bold leading-normal line-clamp-1">#1252 - 10:28 AM</p>
<p class="text-[#648772] dark:text-white/60 text-sm font-normal leading-normal line-clamp-2">1 sản phẩm</p>
</div>
<div class="text-right shrink-0 flex items-center gap-2">
<p class="text-[#111714] dark:text-white text-base font-bold leading-normal">45.000đ</p>
<span class="material-symbols-outlined text-gray-400 dark:text-white/40">chevron_right</span>
</div>
</div>
<!-- List Item 4 -->
<div class="flex items-center gap-4 bg-white dark:bg-white/5 p-4 rounded-xl shadow-sm cursor-pointer">
<div class="flex items-center justify-center rounded-full bg-primary/20 shrink-0 size-12">
<span class="material-symbols-outlined text-primary text-3xl">check_circle</span>
</div>
<div class="flex-grow">
<p class="text-[#111714] dark:text-white text-base font-bold leading-normal line-clamp-1">#1251 - 10:25 AM</p>
<p class="text-[#648772] dark:text-white/60 text-sm font-normal leading-normal line-clamp-2">5 sản phẩm</p>
</div>
<div class="text-right shrink-0 flex items-center gap-2">
<p class="text-[#111714] dark:text-white text-base font-bold leading-normal">250.000đ</p>
<span class="material-symbols-outlined text-gray-400 dark:text-white/40">chevron_right</span>
</div>
</div>
<!-- Empty State Example (can be shown conditionally) -->
<!--
      <div class="flex flex-col items-center justify-center text-center pt-24">
        <span class="material-symbols-outlined text-6xl text-gray-300 dark:text-white/20">receipt_long</span>
        <p class="mt-4 text-base font-medium text-gray-500 dark:text-white/60">Chưa có đơn hàng nào</p>
        <p class="text-sm text-gray-400 dark:text-white/40">Tạo đơn hàng mới để bắt đầu.</p>
      </div>
      -->
</main>
<!-- Floating Action Button -->
<div class="fixed bottom-6 right-6">
<button class="flex items-center justify-center w-16 h-16 rounded-full bg-primary text-white shadow-lg">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1, 'wght' 700;">add</span>
</button>
</div>
</div>
</body></html>
