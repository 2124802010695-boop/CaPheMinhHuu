<!DOCTYPE html>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#36e27b",
            "background-light": "#f6f8f7",
            "background-dark": "#112117",
          },
          fontFamily: {
            "display": ["Manrope", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<div class="relative flex min-h-screen w-full flex-col bg-background-light dark:bg-background-dark group/design-root overflow-x-hidden">

<div class="flex items-center bg-background-light dark:bg-background-dark p-4 pb-2 justify-between sticky top-0 z-10">

<span class="material-symbols-outlined text-3xl">arrow_back_ios_new</span>
</div>

</div>
<div class="flex-grow flex-shrink-0 basis-auto">

<p class="text-[#648772] dark:text-gray-400 text-base font-normal leading-normal">Kết thúc ca: 16:00 - 16/07/2024</p>
</div>
</div>
</div>
</div>

<div class="flex flex-wrap gap-4 p-4">
<div class="flex min-w-[158px] flex-1 flex-col gap-2 rounded-xl p-4 border border-[#dce5df] dark:border-gray-700 bg-white dark:bg-background-dark/50">
<p class="text-[#111714] dark:text-gray-300 text-base font-medium leading-normal">Tổng Doanh Thu</p>
<p class="text-primary dark:text-primary tracking-light text-2xl font-bold leading-tight">5.450.000 VNĐ</p>
</div>
<div class="flex min-w-[158px] flex-1 flex-col gap-2 rounded-xl p-4 border border-[#dce5df] dark:border-gray-700 bg-white dark:bg-background-dark/50">

<p class="text-[#111714] dark:text-white tracking-light text-2xl font-bold leading-tight">125</p>
</div>

</div>
</div>
</div>

<div class="flex justify-center sticky bottom-0 bg-background-light dark:bg-background-dark pt-2 pb-6">
<div class="flex flex-1 gap-3 max-w-[480px] flex-col items-stretch px-4 py-3">
<button class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-14 px-5 bg-primary text-[#111714] text-base font-bold leading-normal tracking-[0.015em] w-full">

</button>
<button class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-14 px-5 bg-background-light dark:bg-gray-800 text-[#111714] dark:text-white text-base font-bold leading-normal tracking-[0.015em] w-full border border-[#dce5df] dark:border-gray-700">
