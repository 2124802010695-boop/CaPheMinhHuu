<!DOCTYPE html>

<html class="light" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Đóng Ca Làm Việc</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#36e27b",
              "background-light": "#f6f8f7",
              "background-dark": "#112117",
            },
            fontFamily: {
              "display": ["Plus Jakarta Sans", "Noto Sans", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings:
        'FILL' 0,
        'wght' 400,
        'GRAD' 0,
        'opsz' 24
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display">
<div class="relative flex h-auto min-h-screen w-full flex-col bg-background-light dark:bg-background-dark group/design-root overflow-x-hidden">
<!-- Top App Bar -->
<div class="flex items-center bg-white dark:bg-zinc-900 p-4 pb-3 justify-between shadow-sm">
<div class="text-[#111714] dark:text-white flex size-10 shrink-0 items-center justify-center">
<span class="material-symbols-outlined text-2xl">close</span>
</div>
<h1 class="text-[#111714] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center">Đóng Ca Làm Việc</h1>
<div class="size-10 shrink-0"></div> <!-- Spacer for centering title -->
</div>
<div class="flex-1 p-4 space-y-4">
<!-- Shift Information Section -->
<div class="p-4 bg-white dark:bg-zinc-900 rounded-xl">
<div class="flex justify-between gap-x-6 py-2 border-b border-gray-100 dark:border-zinc-800">
<p class="text-[#648772] dark:text-gray-400 text-sm font-normal leading-normal">Tên ca:</p>
<p class="text-[#111714] dark:text-white text-sm font-medium leading-normal text-right">Ca Sáng</p>
</div>
<div class="flex justify-between gap-x-6 py-2 border-b border-gray-100 dark:border-zinc-800">
<p class="text-[#648772] dark:text-gray-400 text-sm font-normal leading-normal">Thời gian bắt đầu:</p>
<p class="text-[#111714] dark:text-white text-sm font-medium leading-normal text-right">07:00 - 10/08/2024</p>
</div>
<div class="flex justify-between gap-x-6 py-2">
<p class="text-[#648772] dark:text-gray-400 text-sm font-normal leading-normal">Tiền đầu ca:</p>
<p class="text-[#111714] dark:text-white text-sm font-medium leading-normal text-right">1,000,000đ</p>
</div>
</div>
<!-- Cash Input Field -->
<div class="bg-white dark:bg-zinc-900 p-4 rounded-xl">
<label class="flex flex-col w-full">
<p class="text-[#111714] dark:text-white text-base font-medium leading-normal pb-2">Tiền cuối ca thực tế</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#111714] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-[#dce5df] dark:border-zinc-700 bg-white dark:bg-zinc-800 focus:border-primary h-14 placeholder:text-[#648772] dark:placeholder:text-gray-500 p-[15px] text-base font-normal leading-normal" inputmode="numeric" placeholder="Nhập số tiền mặt" type="text" value="5,450,000"/>
</label>
</div>
<!-- Summary Section -->
<div class="p-4 bg-white dark:bg-zinc-900 rounded-xl">
<div class="flex justify-between gap-x-6 py-2 border-b border-gray-100 dark:border-zinc-800">
<p class="text-[#648772] dark:text-gray-400 text-sm font-normal leading-normal">Tổng tiền mặt dự kiến:</p>
<p class="text-[#111714] dark:text-white text-sm font-medium leading-normal text-right">5,500,000đ</p>
</div>
<div class="flex justify-between gap-x-6 py-2 items-center">
<p class="text-[#648772] dark:text-gray-400 text-sm font-normal leading-normal">Chênh lệch:</p>
<p class="text-red-500 text-base font-bold leading-normal text-right">-50,000đ</p>
</div>
</div>
<!-- Secondary Action Button -->
<div class="flex justify-center">
<button class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-5 flex-1 bg-transparent text-primary dark:text-primary text-base font-bold leading-normal tracking-[0.015em]">
<span class="truncate">Xem Chi Tiết Ca</span>
</button>
</div>
</div>
<!-- Sticky Footer for Primary Action -->
<div class="sticky bottom-0 left-0 right-0 p-4 bg-white dark:bg-zinc-900 border-t border-gray-100 dark:border-zinc-800">
<button class="flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-xl h-14 px-5 bg-primary text-black text-base font-bold leading-normal tracking-[0.015em] shadow-lg shadow-primary/30">
<span class="truncate">Xác Nhận Đóng Ca</span>
</button>
</div>
</div>
</body></html>
