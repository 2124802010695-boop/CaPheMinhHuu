<!DOCTYPE html>

<html class="light" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Mở Ca Làm Việc</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
    .material-symbols-outlined {
      font-variation-settings:
      'FILL' 0,
      'wght' 400,
      'GRAD' 0,
      'opsz' 24
    }
  </style>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#36e27b",
            "background-light": "#f6f8f7",
            "background-dark": "#112117",
          },
          fontFamily: {
            "display": ["Plus Jakarta Sans", "Noto Sans", "sans-serif"]
          },
          borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
        },
      },
    }
  </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark">
<div class="relative flex h-auto min-h-screen w-full flex-col font-display group/design-root overflow-x-hidden">
<div class="absolute inset-0 flex h-full w-full flex-col items-center justify-end bg-black/40">
<div class="flex w-full max-w-md flex-col items-stretch rounded-t-xl bg-white dark:bg-zinc-900">
<button class="flex h-5 w-full items-center justify-center pt-3">
<div class="h-1 w-9 rounded-full bg-slate-200 dark:bg-zinc-700"></div>
</button>
<div class="p-4 pt-1 flex justify-end">
<button class="flex items-center justify-center h-8 w-8 rounded-full bg-slate-100 dark:bg-zinc-800 text-slate-600 dark:text-slate-300">
<span class="material-symbols-outlined text-xl">close</span>
</button>
</div>
<h3 class="text-slate-900 dark:text-white tracking-tight text-2xl font-bold leading-tight px-6 text-center pb-2 pt-0">Mở Ca Làm Việc</h3>
<p class="text-slate-500 dark:text-slate-400 px-6 text-center text-sm pb-6">Nhập số tiền mặt có sẵn trong ngăn kéo khi bắt đầu ca làm việc.</p>
<div class="flex max-w-[480px] flex-wrap items-end gap-4 px-6 py-3">
<label class="flex flex-col min-w-40 flex-1">
<p class="text-slate-800 dark:text-slate-200 text-base font-medium leading-normal pb-2">Số tiền đầu ca</p>
<div class="flex w-full flex-1 items-stretch rounded-lg">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg border-slate-200 dark:border-zinc-700 text-slate-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border bg-white dark:bg-zinc-800 h-14 placeholder:text-slate-400 dark:placeholder:text-zinc-500 p-4 rounded-r-none border-r-0 pr-2 text-lg font-bold leading-normal" placeholder="0" value="1,000,000"/>
<div class="text-slate-500 dark:text-zinc-400 font-semibold flex border border-slate-200 dark:border-zinc-700 bg-slate-50 dark:bg-zinc-900 items-center justify-center px-4 rounded-r-lg border-l-0">VNĐ</div>
</div>
</label>
</div>
<div class="flex gap-3 px-6 py-3 flex-wrap">
<button class="flex h-10 shrink-0 items-center justify-center gap-x-2 rounded-lg bg-slate-100 dark:bg-zinc-800 pl-4 pr-4 transition-colors hover:bg-slate-200 dark:hover:bg-zinc-700">
<p class="text-slate-800 dark:text-slate-200 text-sm font-medium leading-normal">500.000</p>
</button>
<button class="flex h-10 shrink-0 items-center justify-center gap-x-2 rounded-lg bg-primary/20 ring-2 ring-primary pl-4 pr-4">
<p class="text-primary font-bold leading-normal text-sm">1.000.000</p>
</button>
<button class="flex h-10 shrink-0 items-center justify-center gap-x-2 rounded-lg bg-slate-100 dark:bg-zinc-800 pl-4 pr-4 transition-colors hover:bg-slate-200 dark:hover:bg-zinc-700">
<p class="text-slate-800 dark:text-slate-200 text-sm font-medium leading-normal">2.000.000</p>
</button>
</div>
<div class="flex px-6 py-5 justify-center">
<button class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-14 px-5 flex-1 bg-primary text-slate-900 text-base font-bold leading-normal tracking-[0.015em] hover:bg-opacity-90 active:bg-opacity-80 transition-colors">
<span class="truncate">BẮT ĐẦU CA</span>
</button>
</div>
</div>
</div>
</div>
</body></html>
